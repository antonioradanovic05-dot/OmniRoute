<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PointPilot — Share opinions. Earn rewards.</title>
    <meta
      name="description"
      content="PointPilot turns your opinions into points. Take short surveys and redeem them for cash, gift cards, vouchers and donations."
    />
    <meta name="theme-color" content="#5b4bff" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const stored = localStorage.getItem("pp_theme");
        const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = stored || (dark ? "dark" : "light");
      } catch {
        /* private mode */
      }
    </script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#/home" aria-label="PointPilot home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M13.5 2 4 13.5h6L9.5 22 20 10h-6.5l0-8Z" fill="currentColor"/></svg>
          </span>
          <span class="brand-word">Point<span>Pilot</span></span>
        </a>

        <nav class="side-nav" aria-label="Primary">
          <a class="nav-link" href="#/home" data-nav="home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
            <span>Home</span>
          </a>
          <a class="nav-link" href="#/surveys" data-nav="surveys">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="3"/><path d="M9 4.5V3h6v1.5"/><path d="m8.5 11 1.5 1.5 2.5-2.5"/><path d="M8.5 16h7"/></svg>
            <span>Surveys</span>
          </a>
          <a class="nav-link" href="#/rewards" data-nav="rewards">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="13" rx="2.5"/><path d="M3 12.5h18"/><path d="M12 8v13"/><path d="M12 8C10.5 4 6 3.5 6 6.2 6 8 8.5 8 12 8Zm0 0c1.5-4 6-4.5 6-1.8C18 8 15.5 8 12 8Z"/></svg>
            <span>Rewards</span>
          </a>
          <a class="nav-link" href="#/activity" data-nav="activity">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 15v-4"/><path d="M12.5 15V7"/><path d="M17 15v-6"/></svg>
            <span>Activity</span>
          </a>
          <a class="nav-link" href="#/profile" data-nav="profile">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.7"/><path d="M4.5 20.5c.8-3.6 3.8-5.5 7.5-5.5s6.7 1.9 7.5 5.5"/></svg>
            <span>Profile</span>
          </a>
        </nav>

        <div class="sidebar-card" id="sidebar-streak">
          <span class="sidebar-card-glow" aria-hidden="true"></span>
          <div class="sidebar-card-top"><span>Daily streak</span><span class="flame">🔥</span></div>
          <strong id="sidebar-streak-value">0 days</strong>
          <p id="sidebar-streak-copy">Take a survey to start your streak.</p>
          <button class="btn btn-light btn-sm" id="sidebar-bonus-btn" data-action="claim-bonus">Claim daily bonus</button>
        </div>

        <a class="profile-chip" href="#/profile" aria-label="Open profile">
          <span class="avatar avatar-sm" id="sidebar-avatar">🙂</span>
          <span class="profile-chip-text">
            <strong id="sidebar-name">Guest</strong>
            <small id="sidebar-level">Newcomer</small>
          </span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
        </a>
      </aside>

      <div class="main">
        <header class="topbar">
          <form class="search" id="search-form" role="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
            <input
              id="global-search"
              type="search"
              placeholder="Search surveys or brands"
              autocomplete="off"
              aria-label="Search surveys"
            />
          </form>
          <div class="topbar-actions">
            <button class="icon-btn" id="theme-toggle" data-action="toggle-theme" aria-label="Toggle dark mode" title="Toggle theme">
              <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
              <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
            </button>
            <a class="points-pill" href="#/rewards" title="Your points balance">
              <span class="points-bolt" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none"><path d="M13 2 5 13h5l-1 9 8-11h-5l1-9Z" fill="currentColor"/></svg>
              </span>
              <b id="points-pill">0</b>
              <span class="points-label">pts</span>
            </a>
            <a class="avatar avatar-sm topbar-avatar" href="#/profile" id="topbar-avatar" aria-label="Open profile">🙂</a>
          </div>
        </header>

        <main class="view" id="view" tabindex="-1">
          <div class="boot-loading">
            <div class="spinner" aria-hidden="true"></div>
            <p>Loading your dashboard…</p>
          </div>
        </main>
      </div>

      <nav class="bottom-nav" aria-label="Primary mobile">
        <a class="bottom-link" href="#/home" data-nav="home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
          <span>Home</span>
        </a>
        <a class="bottom-link" href="#/surveys" data-nav="surveys">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="3"/><path d="M9 4.5V3h6v1.5"/><path d="m8.5 11 1.5 1.5 2.5-2.5"/><path d="M8.5 16h7"/></svg>
          <span>Surveys</span>
        </a>
        <a class="bottom-link bottom-fab" href="#/surveys" aria-label="Find a survey">
          <span class="fab-inner">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </span>
        </a>
        <a class="bottom-link" href="#/rewards" data-nav="rewards">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="13" rx="2.5"/><path d="M3 12.5h18"/><path d="M12 8v13"/></svg>
          <span>Rewards</span>
        </a>
        <a class="bottom-link" href="#/activity" data-nav="activity">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 15v-4"/><path d="M12.5 15V7"/><path d="M17 15v-6"/></svg>
          <span>Activity</span>
        </a>
      </nav>
    </div>

    <div id="modal-root"></div>
    <div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="false"></div>
    <div class="confetti-layer" id="confetti-layer" aria-hidden="true"></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
